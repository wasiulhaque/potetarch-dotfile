# Appearance follows the Waybar palette.
$font = JetBrainsMono Nerd Font

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = easeOut, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 3, easeOut
    animation = fadeOut, 1, 3, easeOut
    animation = inputFieldDots, 1, 2, easeOut
}

background {
    color = rgba(1b1a25ff)
}

shape {
    size = 364, 246
    color = rgba(1c2030ff)
    border_size = 1
    border_color = rgba(a597dd4a)
    rounding = 12
    position = 0, 16
    halign = center
    valign = center
    zindex = 0
}

label {
    text = <b>$TIME</b>
    color = rgba(f3efffff)
    font_size = 58
    font_family = $font
    position = 0, 70
    halign = center
    valign = center
    zindex = 1
}

label {
    text = cmd[update:60000] date +'%A, %d %b'
    color = rgba(b8b2e9ff)
    font_size = 13
    font_family = $font
    position = 0, 15
    halign = center
    valign = center
    zindex = 1
}

input-field {
    size = 292, 40
    outline_thickness = 1
    inner_color = rgba(242331ff)
    outer_color = rgba(8d80c8ff)
    check_color = rgba(b8b2e9ff)
    fail_color = rgba(f2a8b2ff)
    font_color = rgba(e9e5f7ff)
    rounding = 8
    fade_on_empty = false
    font_family = $font
    placeholder_text = <span size='small'>Password</span>
    check_text = <span size='small'>Unlocking…</span>
    fail_text = <span size='small'>$PAMFAIL$FPRINTFAIL</span>
    dots_size = 0.23
    dots_spacing = 0.35
    position = 0, -44
    halign = center
    valign = center
    zindex = 1
}

label {
    text = $LAYOUT[US]
    color = rgba(b0acbfff)
    font_size = 10
    font_family = $font
    onclick = hyprctl switchxkblayout all next
    position = 0, -81
    halign = center
    valign = center
    zindex = 1
}
